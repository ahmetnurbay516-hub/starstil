<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>STARSTIL — Space War</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;touch-action:none;font-family:monospace;}
canvas{display:block;}
#ui{position:fixed;top:0;left:0;width:100%;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent);}
#score-box{color:#FFD700;font-size:14px;font-weight:bold;text-shadow:0 0 8px #FFD700;}
#center-ui{display:flex;flex-direction:column;align-items:center;gap:2px;}
#wave-box{color:#00F5FF;font-size:12px;font-weight:bold;}
#timer-box{color:#fff;font-size:22px;font-weight:900;letter-spacing:2px;}
#timer-box.danger{color:#FF3333;animation:blink 0.4s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
#health-box{display:flex;gap:3px;}
#fuel-ui{position:fixed;bottom:100px;left:14px;z-index:10;pointer-events:none;}
#fuel-label{color:#FF8800;font-size:10px;font-weight:bold;margin-bottom:3px;}
#fuel-bar-bg{width:14px;height:120px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,136,0,0.4);border-radius:7px;overflow:hidden;display:flex;align-items:flex-end;}
#fuel-fill{width:100%;background:linear-gradient(to top,#FF2200,#FF8800,#FFCC00);border-radius:7px;transition:height 0.2s;box-shadow:0 0 8px #FF8800;}
#fuel-pct{color:#FFAA00;font-size:10px;font-weight:bold;margin-top:3px;text-align:center;}
#wave-banner{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);font-size:26px;font-weight:900;color:#FFD700;letter-spacing:3px;text-shadow:0 0 30px #FFD700;pointer-events:none;z-index:20;opacity:0;transition:opacity 0.5s;text-align:center;}
#wave-theme{position:fixed;top:52%;left:50%;transform:translate(-50%,-50%);font-size:14px;color:rgba(255,255,255,0.8);letter-spacing:2px;pointer-events:none;z-index:20;opacity:0;transition:opacity 0.5s;text-align:center;}
#token-pop{position:fixed;top:72px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:bold;color:#00FF88;text-shadow:0 0 10px #00FF88;pointer-events:none;z-index:15;opacity:0;transition:opacity 0.3s;white-space:nowrap;}
#bomb-ui{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:10;}
#bomb-btn{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,0,0.9),rgba(150,80,0,0.8));border:2px solid rgba(255,200,0,0.6);font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px rgba(255,200,0,0.5);user-select:none;-webkit-user-select:none;}
#bomb-count{color:#FFD700;font-size:12px;font-weight:bold;}
#overlay{position:fixed;inset:0;background:rgba(0,0,10,0.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;}
#overlay h1{font-size:44px;font-weight:900;letter-spacing:6px;margin-bottom:8px;background:linear-gradient(135deg,#FFD700,#00F5FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.tip{color:rgba(255,255,200,0.65);font-size:12px;margin-bottom:3px;text-align:center;}
.big-btn{background:linear-gradient(135deg,#7B2FFF,#00F5FF);border:none;border-radius:50px;padding:16px 50px;color:#fff;font-size:18px;font-weight:900;letter-spacing:3px;cursor:pointer;box-shadow:0 0 30px rgba(123,47,255,0.7);font-family:monospace;margin-top:20px;}
#gameover{position:fixed;inset:0;background:rgba(0,0,0,0.93);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;}
#gameover h1{font-size:44px;color:#FF2222;letter-spacing:4px;margin-bottom:14px;}
.go-r{font-size:15px;color:#FFD700;margin-bottom:6px;}
.go-r2{font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:5px;}
.red-btn{background:linear-gradient(135deg,#CC0000,#FF4400);margin-top:20px;border:none;border-radius:50px;padding:14px 44px;color:#fff;font-size:16px;font-weight:900;letter-spacing:2px;cursor:pointer;font-family:monospace;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="mute-btn" onclick="toggleMute()" style="position:fixed;top:12px;right:70px;z-index:100;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;">🔊</div>
<div id="ui">
  <div id="score-box">⭐ <span id="score">0</span></div>
  <div id="center-ui">
    <div id="wave-box">WAVE <span id="wavenum">1</span></div>
    <div id="timer-box">45</div>
  </div>
  <div id="health-box"></div>
</div>
<div id="fuel-ui">
  <div id="fuel-label">⛽ FUEL</div>
  <div id="fuel-bar-bg"><div id="fuel-fill" style="height:100%"></div></div>
  <div id="fuel-pct">100%</div>
</div>
<div id="wave-banner"></div>
<div id="wave-theme"></div>
<div id="token-pop"></div>
<div id="bomb-ui">
  <div id="bomb-btn">💣</div>
  <div id="bomb-count">x<span id="bombs">3</span></div>
</div>
<div id="achievement-pop" style="position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,rgba(20,0,40,0.95),rgba(0,10,40,0.95));border:1px solid rgba(255,200,0,0.5);border-radius:14px;padding:12px 20px;color:#FFD700;font-family:monospace;font-size:13px;text-align:center;pointer-events:none;z-index:25;opacity:0;transition:all 0.4s;box-shadow:0 0 20px rgba(255,200,0,0.3);white-space:nowrap;"></div>

<div id="overlay">
  <h1>STARSTIL</h1>
  <p class="tip">🕹 Touch screen → move & shoot</p>
  <p class="tip">⛽ Hit enemies → gain fuel</p>
  <p class="tip">💣 Bomb → clear all enemies</p>
  <p class="tip">⚡🛡️⏱️ Kill boss → get power-up</p>
  <button class="big-btn" onclick="startGame()">▶ START</button>
</div>
<div id="gameover">
  <h1>GAME OVER</h1>
  <div class="go-r" id="go-score"></div>
  <div class="go-r" id="go-tokens"></div>
  <div class="go-r2" id="go-wave"></div>
  <div class="go-r2" id="go-time"></div>
  <div class="go-r2" id="go-best"></div>
  <button class="red-btn" onclick="startGame()">🔄 RETRY</button>
</div>

var ctx=canvas.getContext('2d');

var AC = new (window.AudioContext || window.webkitAudioContext)();
function rac(){ if(AC.state==='suspended') AC.resume(); }
var MUTED=false;
function toggleMute(){
  MUTED=!MUTED;
  document.getElementById('mute-btn').textContent=MUTED?'🔇':'🔊';
}

function playB64(b64, vol){
  if(MUTED)return;
  try{
    rac();
    var bin=atob(b64);
    var arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    AC.decodeAudioData(arr.buffer, function(decoded){
      var src=AC.createBufferSource();
      var gain=AC.createGain();
      src.buffer=decoded;
      src.connect(gain); gain.connect(AC.destination);
      gain.gain.setValueAtTime(vol||1.0, AC.currentTime);
      src.start();
    });
  }catch(e){}
}

function playShoot(){
  if(MUTED)return;
  try{
    rac();
    var t=AC.currentTime;
    var o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type='square';
    o.frequency.setValueAtTime(520,t);
    o.frequency.exponentialRampToValueAtTime(80,t+0.09);
    g.gain.setValueAtTime(0.2,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
    o.start(t);o.stop(t+0.09);
  }catch(e){}
}
function playHitSound(){ playB64(SND_HIT, 0.8); }
function playExplode(big){ playB64(big?SND_EX_BIG:SND_EX_SMALL, big?1.0:0.8); }
function playHit(){ playB64(SND_PHIT, 0.9); }
function playWave(){ playB64(SND_WAVE, 0.7); }
function playPowerupSound(){ playB64(SND_PU, 0.8); }

var bgNotes=[65,82,98,110,130,110,98,82];
var bgIdx=0,bgNext=0;
function playBgMusic(){
  if(MUTED||!running||G.frame<bgNext)return;
  bgNext=G.frame+Math.max(8,20-G.waveIdx);
  rac();
  var t=AC.currentTime;
  var freq=bgNotes[bgIdx%bgNotes.length];
  bgIdx++;
  var o=AC.createOscillator();
  var g=AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type='triangle'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.03,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  o.start(t); o.stop(t+0.3);
}

function showPop(txt){
  var e=document.getElementById('token-pop');

}

function startGame(){

    stars:[],frame:0,spawnTimer:0,totalTime:0,waveTimer:0,

function loadWave(idx){
  G.waveIdx=idx;
  var w=WAVES[Math.min(idx,WAVES.length-1)];
  G.currentWave=w;
  G.waveTimer=0;G.spawnTimer=0;G.enemies=[];G.ebullets=[];G.waveBossSpawned=false;
  var b=document.getElementById('wave-banner'),t=document.getElementById('wave-theme');
  b.textContent=w.name;b.style.opacity='1';t.textContent=w.theme;t.style.opacity='1';
  clearTimeout(b._t);clearTimeout(t._t);
  b._t=setTimeout(function(){b.style.opacity='0';},3000);
  t._t=setTimeout(function(){t.style.opacity='0';},3000);
  G.countdown=180; // 3 second countdown
  playWave();updateUI();
}

function updateUI(){
  document.getElementById('score').textContent=G.score.toLocaleString();

  document.getElementById('bombs').textContent=G.bombs;
  var hb=document.getElementById('health-box');hb.innerHTML='';
  for(var i=0;i<3;i++)hb.innerHTML+='<span style="font-size:17px">'+(i<G.health?'❤️':'🖤')+'</span>';
  var fp=Math.max(0,Math.round(G.fuel));
  document.getElementById('fuel-fill').style.height=fp+'%';
  document.getElementById('fuel-pct').textContent=fp+'%';
}

// COMBO SYSTEM
function addCombo(){
  G.combo++;
  G.comboTimer=120;
  if(G.combo>G.maxCombo)G.maxCombo=G.combo;
  if(G.combo>=3){
    var bonus=G.combo*5;
    G.score+=bonus;
    showPop('🔥 COMBO x'+G.combo+' +'+bonus+'!');
  }
  checkAchievements();
}

function drawCombo(){
  if(G.combo<2||G.comboTimer<=0)return;
  var alpha=Math.min(1,G.comboTimer/60);
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.font='bold '+(16+G.combo)+'px monospace';
  ctx.fillStyle=G.combo>=10?'#FF0000':G.combo>=5?'#FF8800':'#FFFF00';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=15;
  ctx.fillText('🔥 x'+G.combo,canvas.width/2,canvas.height*0.42);
  ctx.restore();
}

var achQueue=[];

// SCREEN SHAKE
function addShake(amount){G.screenShake=Math.max(G.screenShake,amount);}

function playBgMusic(){
  try{

  if(G.frame<bgNextNote)return;
  var tempo=Math.max(8,28-G.waveIdx*1);
  bgNextNote=G.frame+tempo;
  rac();
  var freq=bgNotes[bgNoteIdx%bgNotes.length];
  bgNoteIdx++;
  var o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0.04,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.3);
  o.start();o.stop(AC.currentTime+0.3);

  }catch(e){}
}

function drawRock(en){
  ctx.save();ctx.translate(en.x,en.y);ctx.rotate(en.rot||0);
  var r=en.w*0.48;
  var pts=en.big?12:9;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(0,r*0.6,r*0.8,r*0.22,0,0,Math.PI*2);ctx.fill();
  // Base
  ctx.fillStyle=en.col;
  ctx.beginPath();
  for(var i=0;i<pts;i++){
    var a=(i/pts)*Math.PI*2;
    var seed=(Math.sin(i*7919.3)*0.5+0.5);
    var rv=r*(0.62+seed*0.3);
    if(i===0)ctx.moveTo(Math.cos(a)*rv,Math.sin(a)*rv);
    else ctx.lineTo(Math.cos(a)*rv,Math.sin(a)*rv);
  }
  ctx.closePath();ctx.fill();
  // Highlight
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.beginPath();ctx.ellipse(-r*0.22,-r*0.22,r*0.28,r*0.18,0.5,0,Math.PI*2);ctx.fill();
  // Crack
  ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=en.big?2:1.5;
  ctx.beginPath();ctx.moveTo(-r*0.3,-r*0.5);ctx.lineTo(r*0.2,r*0.25);ctx.stroke();
  if(en.hp<en.maxHp){ctx.strokeStyle='rgba(255,150,50,0.5)';ctx.beginPath();ctx.moveTo(r*0.3,-r*0.3);ctx.lineTo(-r*0.15,r*0.35);ctx.stroke();}
  ctx.restore();
}

  tbg.addColorStop(0,darken(en.col));tbg.addColorStop(0.5,en.col);tbg.addColorStop(1,darken(en.col));

function lighten(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+60);g=Math.min(255,g+60);b=Math.min(255,b+60);
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}
function darken(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,r-50);g=Math.max(0,g-50);b=Math.max(0,b-50);
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}

  var pulse=Math.sin(G.frame*0.1+en.x)*0.5+0.5;
  // Glow
  var ag=ctx.createRadialGradient(0,0,W*0.2,0,0,W*0.7);
  ag.addColorStop(0,en.col+'44');ag.addColorStop(1,'transparent');
  ctx.fillStyle=ag;ctx.beginPath();ctx.arc(0,0,W*0.7,0,Math.PI*2);ctx.fill();
  // Saucer body
  var dg=ctx.createLinearGradient(0,-H*0.2,0,H*0.25);
  dg.addColorStop(0,lighten(en.col));dg.addColorStop(0.5,en.col);dg.addColorStop(1,darken(en.col));
  ctx.fillStyle=dg;ctx.beginPath();ctx.ellipse(0,H*0.08,W*0.52,H*0.2,0,0,Math.PI*2);ctx.fill();
  // Rim
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,H*0.08,W*0.52,H*0.2,0,0,Math.PI*2);ctx.stroke();
  // Rotating lights
  for(var li=0;li<6;li++){
    var la=(li/6)*Math.PI*2+G.frame*0.06;
    var lx=Math.cos(la)*W*0.44,ly=H*0.08+Math.sin(la)*H*0.16;
    var lc=['#FF0000','#00FF00','#0088FF','#FFFF00','#FF00FF','#00FFFF'][li];
    ctx.fillStyle=lc;ctx.beginPath();ctx.arc(lx,ly,3,0,Math.PI*2);ctx.fill();
  }
  // Dome
  var cdg=ctx.createRadialGradient(-W*0.06,-H*0.16,0,0,-H*0.08,W*0.26);
  cdg.addColorStop(0,'rgba(200,240,255,0.92)');cdg.addColorStop(0.5,'rgba(80,200,255,0.6)');cdg.addColorStop(1,'rgba(0,80,180,0.2)');
  ctx.fillStyle=cdg;ctx.beginPath();ctx.ellipse(0,-H*0.1,W*0.22,H*0.22,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,H*0.0,W*0.22,H*0.05,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.ellipse(-W*0.07,-H*0.2,W*0.07,H*0.05,-0.4,0,Math.PI*2);ctx.fill();
  // Alien eyes
  ctx.fillStyle='rgba(0,255,100,0.7)';
  ctx.beginPath();ctx.arc(-W*0.06,-H*0.14,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(W*0.04,-H*0.14,3,0,Math.PI*2);ctx.fill();
  if(en.hp<en.maxHp){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-W*0.44,H*0.36,W*0.88,6);ctx.fillStyle=en.col;ctx.fillRect(-W*0.44,H*0.36,W*0.88*(en.hp/en.maxHp),6);}
  ctx.shadowColor=en.col;ctx.shadowBlur=18;ctx.restore();
}

function drawCube(en){
  ctx.save();ctx.translate(en.x,en.y);ctx.rotate(en.rot||0);
  var S=en.w*0.44;
  var pulse=Math.sin(G.frame*0.08+en.x*0.01)*0.5+0.5;
  // Glow aura
  var ag=ctx.createRadialGradient(0,0,S*0.3,0,0,S*1.5);
  ag.addColorStop(0,en.col+'55');ag.addColorStop(1,'transparent');
  ctx.fillStyle=ag;ctx.beginPath();ctx.arc(0,0,S*1.5,0,Math.PI*2);ctx.fill();
  // 3D cube — right face
  ctx.fillStyle=darken(en.col);
  ctx.beginPath();ctx.moveTo(S,-S);ctx.lineTo(S*1.28,-S*0.72);ctx.lineTo(S*1.28,S*0.72);ctx.lineTo(S,S);ctx.closePath();ctx.fill();
  // Bottom face
  ctx.fillStyle=darken(en.col);
  ctx.beginPath();ctx.moveTo(-S,S);ctx.lineTo(S,S);ctx.lineTo(S*1.28,S*0.72);ctx.lineTo(-S*0.72,S*0.72);ctx.closePath();ctx.fill();
  // Front face — main
  var tg=ctx.createLinearGradient(-S,-S,S,S);
  tg.addColorStop(0,lighten(en.col));tg.addColorStop(0.5,en.col);tg.addColorStop(1,darken(en.col));
  ctx.fillStyle=tg;ctx.beginPath();ctx.moveTo(-S,-S);ctx.lineTo(S,-S);ctx.lineTo(S,S);ctx.lineTo(-S,S);ctx.closePath();ctx.fill();
  // Grid lines
  ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,-S);ctx.lineTo(0,S);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-S,0);ctx.lineTo(S,0);ctx.stroke();
  // Neon edges
  ctx.strokeStyle=en.col;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-S,-S);ctx.lineTo(S,-S);ctx.lineTo(S,S);ctx.lineTo(-S,S);ctx.closePath();ctx.stroke();
  ctx.strokeStyle=lighten(en.col);ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(S,-S);ctx.lineTo(S*1.28,-S*0.72);ctx.stroke();
  ctx.beginPath();ctx.moveTo(S,S);ctx.lineTo(S*1.28,S*0.72);ctx.stroke();
  // Corner dots
  ctx.fillStyle='rgba(255,255,255,'+(0.4+pulse*0.5)+')';
  [[-S,-S],[S,-S],[S,S],[-S,S]].forEach(function(p){ctx.beginPath();ctx.arc(p[0],p[1],3,0,Math.PI*2);ctx.fill();});
  // Energy core
  var cg=ctx.createRadialGradient(0,0,0,0,0,S*0.3);
  cg.addColorStop(0,'rgba(255,255,255,'+(0.5+pulse*0.4)+')');
  cg.addColorStop(0.5,en.col+'99');cg.addColorStop(1,'transparent');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,S*0.3,0,Math.PI*2);ctx.fill();
  if(en.big&&en.hp<en.maxHp){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-S,S*1.1,S*2,7);ctx.fillStyle=en.col;ctx.fillRect(-S,S*1.1,S*2*(en.hp/en.maxHp),7);}
  ctx.shadowColor=en.col;ctx.shadowBlur=20;ctx.restore();
}

function drawEnemy(en){
  if(en.type==='fighter')drawFighter(en);
  else if(en.type==='cube')drawCube(en);
  else if(en.type==='heli')drawHeli(en);
  else if(en.type==='ufo')drawUFO(en);
  else if(en.type==='plane')drawPlane(en);
  else if(en.type==='bomber')drawBomber(en);
  else if(en.type==='rocket')drawRocket(en);
  else if(en.type==='boss')drawBoss(en);
  else if(en.type==='waveboss')drawWaveBoss(en);
}

function loop(){
  if(!running)return;
  raf=requestAnimationFrame(loop);
  var W=canvas.width,H=canvas.height;
  G.frame++;G.totalTime++;G.waveTimer++;
  var def=G.currentWave;
  var secLeft=Math.max(0,Math.ceil((def.dur*60-G.waveTimer)/60));
  var te=document.getElementById('timer-box');
  te.textContent=secLeft;te.className=secLeft<=10?'danger':'';

  // Fuel drain
  G.fuel=Math.max(0,G.fuel-G.fuelDrain);updateUI();
  if(G.fuel<=0){gameOver('⛽ Out of fuel!');return;}

  // Wave boss at 75%
  if(G.waveTimer>=Math.floor(def.dur*60*0.75)&&!G.waveBossSpawned){
    G.waveBossSpawned=true;
    var wb=makeWaveBoss(G.waveIdx);
    G.enemies.push(wb);
    showPop('⚠️ WAVE CANAVARI GELİYOR!');
  }

  // Wave end
  var aliveEnemies=G.enemies.filter(function(e){return e.kind==='enemy';});
  if(G.waveTimer>=def.dur*60&&aliveEnemies.length===0||G.waveTimer>=def.dur*60+200){
    G.tokens+=80;G.score+=200;G.fuel=Math.min(100,G.fuel+20);
    showPop('+80 $STARSTIL WAVE BONUSU! ⛽+20%');
    G.bombs=Math.min(G.bombs+1,6);
    loadWave(G.waveIdx+1);return;
  }

  // BG
  ctx.fillStyle='#03000F';ctx.fillRect(0,0,W,H);
  G.stars.forEach(function(s){s.y+=s.sp;if(s.y>H)s.y=0;ctx.fillStyle='rgba(255,255,255,'+(0.15+s.s*0.2)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.s*0.5,0,Math.PI*2);ctx.fill();});

  // Background music
  playBgMusic();

  // Screen shake
  var shakeX=0,shakeY=0;
  if(G.screenShake>0){
    shakeX=(Math.random()-0.5)*G.screenShake*2;
    shakeY=(Math.random()-0.5)*G.screenShake*2;
    ctx.translate(shakeX,shakeY);
    G.screenShake*=0.85;
    if(G.screenShake<0.5)G.screenShake=0;
  }

  // Combo timer
  if(G.comboTimer>0){G.comboTimer--;if(G.comboTimer===0)G.combo=0;}

  // Powerup timer
  if(G.powerupTimer>0){G.powerupTimer--;if(G.powerupTimer===0)G.powerup=null;}

  // Countdown
  if(G.countdown>0){
    G.countdown--;
    drawCountdown();
    if(G.countdown>0)return;
  }

  // Spawn
  G.spawnTimer++;
  var sr=Math.max(15,def.rate-G.waveIdx*3);
  var spawnMult=G.powerup==='slowmo'?2:1;
  if(G.spawnTimer>=sr*spawnMult&&G.waveTimer<def.dur*60){
    var pool=def.pool;
    var en=makeEnemy(pool[Math.floor(Math.random()*pool.length)]);
    if(en)G.enemies.push(en);
    G.spawnTimer=0;
  }

  // Ship move
  var sh=G.ship,spd=5.5;
  if(touchX!==null){var diff=touchX-sh.x;sh.vx=Math.sign(diff)*Math.min(spd,Math.abs(diff)*0.18);}
  else sh.vx*=0.8;
  if(keys['ArrowLeft']||keys['a'])sh.vx=-spd;
  if(keys['ArrowRight']||keys['d'])sh.vx=spd;
  if(keys[' '])firing=true;
  sh.x=Math.max(28,Math.min(W-28,sh.x+sh.vx));
  if(sh.invincible>0)sh.invincible--;

  // Shoot
  sh.shootCd--;
  if((firing||keys[' '])&&sh.shootCd<=0){
    playShoot();
    G.bullets.push({x:sh.x,y:sh.y-32,vx:0,vy:-16,w:5,h:20,col:'#00F5FF'});
    G.bullets.push({x:sh.x-18,y:sh.y-8,vx:-0.4,vy:-14,w:3,h:14,col:'#AA66FF'});
    G.bullets.push({x:sh.x+18,y:sh.y-8,vx:0.4,vy:-14,w:3,h:14,col:'#AA66FF'});
    if(G.powerup==='tripleshot'){
      G.bullets.push({x:sh.x-36,y:sh.y-4,vx:-1,vy:-14,w:3,h:14,col:'#FFFF00'});
      G.bullets.push({x:sh.x+36,y:sh.y-4,vx:1,vy:-14,w:3,h:14,col:'#FFFF00'});
      G.bullets.push({x:sh.x,y:sh.y-32,vx:-0.5,vy:-15,w:4,h:16,col:'#FFFF00'});
      G.bullets.push({x:sh.x,y:sh.y-32,vx:0.5,vy:-15,w:4,h:16,col:'#FFFF00'});
    }
    sh.shootCd=G.powerup==='tripleshot'?5:7;
  }

  G.bullets=G.bullets.filter(function(b){b.x+=b.vx;b.y+=b.vy;return b.y>-20;});
  G.ebullets=G.ebullets.filter(function(b){b.x+=b.vx;b.y+=b.vy;return b.y<H+20&&b.x>-30&&b.x<W+30;});

  // Update enemies
  G.enemies=G.enemies.filter(function(en){
    en.x+=en.vx;en.y+=en.vy;
    if(en.rot!==undefined)en.rot+=en.rotSpeed||0;
    if(en.type==='heli'||en.type==='plane'){if(en.x<-120||en.x>W+120)return false;}
    else if(en.type==='boss'||en.type==='waveboss'){if(en.x<85||en.x>W-85)en.vx*=-1;}
    else{if(en.x<22||en.x>W-22)en.vx*=-1;}

    // Enemy shoot
    if(en.shootRate>0){
      en.shootCd--;
      if(en.shootCd<=0){
        var dx=sh.x-en.x,dy=sh.y-en.y,dist=Math.sqrt(dx*dx+dy*dy);
        var bs=en.type==='boss'||en.type==='waveboss'?4.5:3;
        G.ebullets.push({x:en.x,y:en.y+en.h*0.4,vx:dx/dist*bs,vy:dy/dist*bs,r:en.type==='boss'||en.type==='waveboss'?10:7,col:en.col});
        if((en.type==='boss'||en.type==='waveboss')&&G.frame%4===0){
          G.ebullets.push({x:en.x,y:en.y+en.h*0.3,vx:(dx/dist-0.4)*bs,vy:dy/dist*bs,r:7,col:en.col});
          G.ebullets.push({x:en.x,y:en.y+en.h*0.3,vx:(dx/dist+0.4)*bs,vy:dy/dist*bs,r:7,col:en.col});
        }
        en.shootCd=en.shootRate;
      }
    }

    // Hit by bullets
    if(en.kind!=='enemy'){
      // Enemy escaped — lose 20% fuel
    if(en.y > canvas.height+20){
      if(en.kind==='enemy'){
        G.fuel=Math.max(0,G.fuel-20);
        showPop('❌ ESCAPED! ⛽-20%');
        updateUI();
        if(G.fuel<=0){ gameOver('⛽ Out of fuel!'); return false; }
      }
      return false;
    }
    return en.x>-130&&en.x<canvas.width+130;
    }
    for(var bi=G.bullets.length-1;bi>=0;bi--){
      var b=G.bullets[bi];
      if(Math.abs(b.x-en.x)<en.w*0.52&&Math.abs(b.y-en.y)<en.h*0.52){
        en.hp--;G.bullets.splice(bi,1);
        spawnParticles(b.x,b.y,en.col,5);
        G.fuel=Math.min(100,G.fuel+2);
        playHit();
        if(en.hp<=0){
          playExplode(en.type==='boss'||en.type==='waveboss');
          spawnParticles(en.x,en.y,en.col,en.type==='boss'||en.type==='waveboss'?35:14);
          G.score+=en.pts;G.tokens+=en.tokens;G.kills++;
          addCombo();addShake(en.type==='boss'||en.type==='waveboss'?12:3);
          var fr=en.type==='boss'||en.type==='waveboss'?15:en.type==='bomber'?8:en.type==='heli'?6:3;
          G.fuel=Math.min(100,G.fuel+fr);
          showPop('+'+en.tokens+' $STARSTIL ⛽+'+fr+'%');
          if(en.type==='boss'||en.type==='waveboss')spawnPowerup(en.x,en.y);
          if(G.kills%50===0){G.health=Math.min(3,G.health+1);showPop('❤️ EXTRA LIFE!');updateUI();}
          checkAchievements();updateUI();return false;
        }
      }
    }

    // Powerup collection
    if(en.kind==='powerup'&&Math.abs(en.x-sh.x)<38&&Math.abs(en.y-sh.y)<38){
      activatePowerup(en.type);spawnParticles(en.x,en.y,en.col,12);return false;
    }

    // Ram player
    if(en.kind==='enemy'&&sh.invincible<=0&&Math.abs(en.x-sh.x)<32&&Math.abs(en.y-sh.y)<36){
      playHit();G.health--;sh.invincible=90;G.fuel=Math.max(0,G.fuel-15);
      addShake(8);G.combo=0;G.comboTimer=0;
      spawnParticles(sh.x,sh.y,'#FF3333',12);updateUI();
      if(G.health<=0){gameOver('💀 Lives lost!');return false;}
    }
    // Enemy escaped screen — lose 20% fuel
    if(en.y>=H+20 && en.kind==='enemy'){
      G.fuel=Math.max(0,G.fuel-20);
      showPop('❌ ESCAPED! ⛽-20%');
      updateUI();
      if(G.fuel<=0){ gameOver('⛽ Out of fuel!'); }
      return false;
    }
    return en.y<H+130;
  });

  // Enemy bullets hit player
  for(var bi=G.ebullets.length-1;bi>=0;bi--){
    var b=G.ebullets[bi];
    if(sh.invincible<=0&&Math.abs(b.x-sh.x)<26&&Math.abs(b.y-sh.y)<34){
      playHit();G.health--;sh.invincible=90;G.ebullets.splice(bi,1);G.fuel=Math.max(0,G.fuel-10);
      spawnParticles(sh.x,sh.y,'#FF3333',9);updateUI();
      if(G.health<=0){gameOver('💀 Lives lost!');return false;}
    }
  }

  // Particles
  G.particles=G.particles.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vx*=0.93;p.vy*=0.93;p.life-=p.decay;return p.life>0;});
  ctx.shadowBlur=0;
  G.particles.forEach(function(p){ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  // Draw enemy bullets
  G.ebullets.forEach(function(b){ctx.shadowColor=b.col;ctx.shadowBlur=12;ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();});
  // Draw player bullets
  G.bullets.forEach(function(b){ctx.shadowColor=b.col;ctx.shadowBlur=8;ctx.fillStyle=b.col;ctx.fillRect(b.x-b.w/2,b.y,b.w,b.h);});
  ctx.shadowBlur=0;
  G.enemies.forEach(function(en){
    if(en.kind==='powerup')drawPowerup(en);
    else drawEnemy(en);
  });
  drawShip(sh.x,sh.y,sh.invincible);
  drawCombo();
  drawPowerupBar();
  if(G.fuel<20){ctx.fillStyle='rgba(255,30,0,'+(0.04+Math.sin(G.frame*0.15)*0.04)+')';ctx.fillRect(0,0,W,H);}
}

function gameOver(reason){
  running=false;
  var s=Math.floor(G.totalTime/60);
  // Save high score
  try{
    var scores=JSON.parse(localStorage.getItem('starstil_scores')||'[]');
    scores.push({score:G.score,wave:G.waveIdx+1,date:new Date().toLocaleDateString()});
    scores.sort(function(a,b){return b.score-a.score;});
    scores=scores.slice(0,5);
    localStorage.setItem('starstil_scores',JSON.stringify(scores));
  }catch(e){}
  document.getElementById('gameover').style.display='flex';
  document.getElementById('go-score').textContent='⭐ '+G.score.toLocaleString()+' points';
  document.getElementById('go-tokens').textContent='💰 '+G.tokens+' $STARSTIL earned';
  document.getElementById('go-wave').textContent='🌊 Wave '+(G.waveIdx+1)+' | Combo: x'+G.maxCombo;
  document.getElementById('go-time').textContent='⏱ '+Math.floor(s/60)+'m '+(s%60)+'s | '+reason;
  // Show best score
  try{
    var best=JSON.parse(localStorage.getItem('starstil_scores')||'[]');
    if(best.length>0)document.getElementById('go-best').textContent='🏆 Best score: '+best[0].score.toLocaleString();
  }catch(e){}
}
</script>
</body>
</html>
